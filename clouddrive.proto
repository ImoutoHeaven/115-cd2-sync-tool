    NotFirstVolume = 2;
    InsideArchiveFolder = 3;
    Encrypted = 4;
    Damaged = 5;
  }

  bool supported = 1;
  string format = 2;
  bool needsPassword = 3;
  bool isSacd = 4;
  bool hasStereo = 5;
  bool hasMultichannel = 6;
