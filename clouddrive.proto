enum DevicePowerType {
  DESKTOP = 0;
  SLOW_STORAGE = 1;
  BATTERY = 2;
}

enum ProxyType {
  SYSTEM = 0;
  NOPROXY = 1;
  HTTP = 2;
  SOCKS5 = 3;
}

enum QRCodeScanMessageType {
  SHOW_IMAGE = 0;
  SHOW_IMAGE_CONTENT = 1;
  CHANGE_STATUS = 2;
  CLOSE = 3;
  ERROR = 4;
}

enum UpdateChannel {
  Release = 0;
  Beta = 1;
  Alpha = 2;
}

enum LogLevel {
  Trace = 0;
  Debug = 1;
  Info = 2;
  Warn = 3;
  Error = 4;
}

enum EvictionStrategy {
  LRU = 0;
  LARGEST_FIRST = 1;
  SMALLEST_FIRST = 2;
}

enum ExtensionFilterMode {
  EXTENSION_FILTER_DISABLED = 0;
  EXTENSION_FILTER_INCLUDE = 1;
  EXTENSION_FILTER_EXCLUDE = 2;
}

enum HintPriority {
  HINT_PRIORITY_LOW = 0;
  HINT_PRIORITY_NORMAL = 1;
  HINT_PRIORITY_HIGH = 2;
}

enum VacuumStatus {
  VACUUM_IDLE = 0;
  VACUUM_RUNNING = 1;
  VACUUM_COMPLETED = 2;
  VACUUM_FAILED = 3;
}

enum VerifyStorePurchaseStatus {
  VERIFY_STORE_PURCHASE_SUCCESS = 0;
  VERIFY_STORE_PURCHASE_ALREADY_ACTIVE = 1;
  VERIFY_STORE_PURCHASE_PENDING = 2;
}

enum OfflineFileStatus {
  OFFLINE_INIT = 0;
  OFFLINE_DOWNLOADING = 1;
  OFFLINE_FINISHED = 2;
  OFFLINE_ERROR = 3;
  OFFLINE_UNKNOWN = 4;
}

enum CloudSyncAccountState {
  CloudSyncSame = 0;
  CloudSyncDiffer = 1;
  CloudSyncOnlyLocal = 2;
  CloudSyncOnlyCloud = 3;
}

enum CloudSyncStrategy {
  CloudSyncRemoteOverwritesLocal = 0;
  CloudSyncLocalOverwritesRemote = 1;
}

enum FileReplaceRule {
  Skip = 0;
  Overwrite = 1;
  KeepHistoryVersion = 2;
}

enum FileDeleteRule {
  Delete = 0;
  Recycle = 1;
  Keep = 2;
  MoveToVersionHistory = 3;
}

enum FileCompletionRule {
  None = 0;
  DeleteSource = 1;
  DeleteSourceAndEmptyFolder = 2;
}

enum BackupSyncMode {
  BackupOneWay = 0;
  BackupTwoWay = 1;
}

enum BackupConflictPolicy {
  ConflictKeepBoth = 0;
  ConflictNewestWins = 1;
  ConflictSourceWins = 2;
  ConflictDestinationWins = 3;
}

enum BackupBootstrapExtrasPolicy {
  BootstrapCopyExtrasToSource = 0;
  BootstrapLeaveExtras = 1;
}

enum SolidArchiveMode {
  SolidNeverExtract = 0;
  SolidInMemory = 1;
  SolidLocalCache = 2;
}

message GetTokenRequest {
  string userName = 1;
  string password = 2;
  optional string totpCode = 3;
}

message JWTToken {
  bool success = 1;
  string errorMessage = 2;
  string token = 3;
  google.protobuf.Timestamp expiration = 4;
}

message FileRequest {
  string path = 1;
  optional bool forceRefresh = 2;
}

message MultiFileRequest {
  repeated string path = 1;
}

message FileOperationResult {
  bool success = 1;
  string errorMessage = 2;
  repeated string resultFilePaths = 3;
}

message StringResult {
  string result = 1;
}

message GetDownloadUrlPathRequest {
  string path = 1;
  bool preview = 2;
  bool lazy_read = 3;
  bool get_direct_url = 4;
}

message DownloadUrlPathInfo {
  string downloadUrlPath = 1;
  optional uint64 expiresIn = 2;
  optional string directUrl = 3;
  optional string userAgent = 4;
  map<string, string> additionalHeaders = 5;
}

message BoolResult {
  bool result = 1;
}

message UnmountArchiveResult {
  string result = 1;
}

message ListSubFileRequest {
  string path = 1;
  bool forceRefresh = 2;
  optional bool checkExpires = 3;
}

message SearchRequest {
  string path = 1;
  string searchFor = 2;
  bool forceRefresh = 3;
  bool fuzzyMatch = 4;
  optional bool addResultToMountedSearchFolder = 5;
  optional bool contentSearch = 6;
}

message AddOfflineFileRequest {
  string urls = 1;
  string toFolder = 2;
  optional uint64 checkFolderAfterSecs = 3;
}

message RemoveOfflineFilesRequest {
  string cloudName = 1;
  string cloudAccountId = 2;
  bool deleteFiles = 3;
  repeated string infoHashes = 4;
  optional string path = 5;
}

message AddSharedLinkRequest {
  string sharedLinkUrl = 1;
  optional string sharedPassword = 2;
  string toFolder = 3;
}

message SubFilesReply {
  repeated CloudDriveFile subFiles = 1;
}

message FindFileByPathRequest {
  string parentPath = 1;
  string path = 2;
}

message CreateFolderRequest {
  string parentPath = 1;
  string folderName = 2;
}

message CreateEncryptedFolderRequest {
  string parentPath = 1;
  string folderName = 2;
  string password = 3;
  bool savePassword = 4;
}

message UnlockEncryptedFileRequest {
  string path = 1;
  string password = 2;
  bool permanentUnlock = 3;
}

message CreateFolderResult {
  CloudDriveFile folderCreated = 1;
  FileOperationResult result = 2;
}

message CreateFileRequest {
  string parentPath = 1;
  string fileName = 2;
}

message CreateFileResult {
  uint64 fileHandle = 1;
}

message CloseFileRequest {
  uint64 fileHandle = 1;
  optional bool uploadImmediately = 2;
}

message MoveFileRequest {
  enum ConflictPolicy {
    Overwrite = 0;
    Rename = 1;
    Skip = 2;
  }

  repeated string theFilePaths = 1;
  string destPath = 2;
  optional MoveFileRequest.ConflictPolicy conflictPolicy = 3;
  optional bool moveAcrossClouds = 4;
  optional bool handleConflictRecursively = 5;
}

message CopyFileRequest {
  enum ConflictPolicy {
    Overwrite = 0;
    Rename = 1;
    Skip = 2;
  }

  repeated string theFilePaths = 1;
  string destPath = 2;
  optional CopyFileRequest.ConflictPolicy conflictPolicy = 3;
  optional bool handleConflictRecursively = 5;
}

message WriteFileRequest {
  uint64 fileHandle = 1;
  uint64 startPos = 2;
  uint64 length = 3;
  bytes buffer = 4;
  bool closeFile = 5;
  optional bool uploadImmediately = 6;
}

message WriteFileResult {
  uint64 bytesWritten = 1;
}

message RenameFileRequest {
  string theFilePath = 1;
  string newName = 2;
}

message RenameFilesRequest {
  repeated RenameFileRequest renameFiles = 1;
}

message CloudDriveFile {
  enum FileType {
    Directory = 0;
    File = 1;
    Other = 2;
  }

  enum HashType {
    Unknown = 0;
    Md5 = 1;
    Sha1 = 2;
    PikPakSha1 = 3;
  }

  enum FileEncryptionType {
    None = 0;
    Encrypted = 1;
    Unlocked = 2;
  }

  string id = 1;
  string name = 2;
  string fullPathName = 3;
  int64 size = 4;
  CloudDriveFile.FileType fileType = 5;
  google.protobuf.Timestamp createTime = 6;
  google.protobuf.Timestamp writeTime = 7;
  google.protobuf.Timestamp accessTime = 8;
  CloudAPI CloudAPI = 9;
  string thumbnailUrl = 10;
  string previewUrl = 11;
  string originalPath = 14;
